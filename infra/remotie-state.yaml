AWSTemplateFormatVersion: "2010-09-09"
Description: Remotie stream state storage.

Parameters:
  TableName:
    Type: String
    Default: remotie-stream-state
    Description: DynamoDB table name for Remotie stream status.

Resources:
  StreamStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

Outputs:
  StreamStateTableName:
    Description: Set this value as REMOTIE_STREAM_TABLE in Amplify.
    Value: !Ref StreamStateTable
  StreamStateTableArn:
    Description: Grant Amplify compute role GetItem and PutItem on this ARN.
    Value: !GetAtt StreamStateTable.Arn
